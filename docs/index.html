<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counter</title>
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:sans-serif;
    text-align:center;
    color:white;
    background:linear-gradient(160deg,#1e1b4b,#7c3aed);
  }
  h1{font-size:1.6rem;margin:0 0 10px}
  #n{font-size:7rem;margin:0;font-weight:bold}
  .card{
    background:rgba(255,255,255,0.12);
    padding:30px 40px;
    border-radius:20px;
  }
  #next{opacity:0.8}
</style>
</head>
<body>
<div class="card">
  <h1>My Counter</h1>
  <p id="n">0</p>
  <p>Counts up by 1 every 2 minutes</p>
  <p id="next"></p>
</div>
<script>
  const START = new Date("2026-10-24T00:00:00Z").getTime();
  const INTERVAL = 2 * 60 * 1000;
  function update() {
    const elapsed = Date.now() - START;
    document.getElementById("n").textContent = Math.floor(elapsed / INTERVAL);
    const left = Math.ceil((INTERVAL - (elapsed % INTERVAL)) / 1000);
    document.getElementById("next").textContent = "Next number in " + left + "s";
  }
  update();
  setInterval(update, 1000);
</script>
</body>
</html>
